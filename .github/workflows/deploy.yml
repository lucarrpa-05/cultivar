name: Deploy to GitHub Pages

# The app reads data/inbox/** at runtime from raw.githubusercontent.com, so the
# daily inbox commit must not trigger a rebuild. Docs and root markdown don't
# ship either.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/inbox/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        # BASE_PATH follows the repo name, so https://<owner>.github.io/<repo>/ works
        # without editing vite.config.ts.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
