<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 180" font-family="system-ui, sans-serif">
  <defs>
    <marker id="yam-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="14" y="26" fill="currentColor" font-size="14" font-weight="600">One message, many horses</text>
  <line x1="30" y1="86" x2="430" y2="86" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g fill="currentColor">
    <circle cx="30" cy="86" r="7"/>
    <circle cx="130" cy="86" r="7"/>
    <circle cx="230" cy="86" r="7"/>
    <circle cx="330" cy="86" r="7"/>
    <circle cx="430" cy="86" r="7"/>
  </g>
  <g fill="currentColor" font-size="11" text-anchor="middle" fill-opacity="0.85">
    <text x="80" y="76">~25 miles</text>
    <text x="180" y="76">~25 miles</text>
    <text x="280" y="76">~25 miles</text>
    <text x="380" y="76">~25 miles</text>
  </g>
  <g fill="currentColor" font-size="11" text-anchor="middle">
    <text x="30" y="110">station</text>
    <text x="130" y="110">station</text>
    <text x="230" y="110">station</text>
    <text x="330" y="110">station</text>
    <text x="430" y="110">station</text>
    <text x="30" y="126" fill-opacity="0.8">fresh horse</text>
    <text x="130" y="126" fill-opacity="0.8">fresh horse</text>
    <text x="230" y="126" fill-opacity="0.8">fresh horse</text>
    <text x="330" y="126" fill-opacity="0.8">fresh horse</text>
    <text x="430" y="126" fill-opacity="0.8">fresh horse</text>
  </g>
  <path d="M 30 50 L 424 50" stroke="currentColor" stroke-width="1.8" fill="none" marker-end="url(#yam-arrow)"/>
  <text x="228" y="42" fill="currentColor" font-size="12" text-anchor="middle">the dispatch never rests</text>
  <text x="14" y="160" fill="currentColor" font-size="12">A rider with a paiza tablet swaps mounts and rides on.</text>
</svg>
