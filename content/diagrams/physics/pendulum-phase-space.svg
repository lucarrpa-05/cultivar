  <g fill="currentColor" font-size="13" fill-opacity="0.8">
    <text x="350" y="225">hanging still</text>
    <text x="589.660973353061" y="195">balanced upside down</text>
    <text x="24" y="120">over the top, again and again</text>
    <text x="24" y="356">over the top, the other way</text>
    <text x="244" y="147" text-anchor="middle">swinging back and forth</text>
  </g>
  <g fill="currentColor" font-size="13">
    <text x="24" y="386">The dashed curve is the knife edge: arrive with exactly that energy and you never quite fall over.</text>
  </g>
