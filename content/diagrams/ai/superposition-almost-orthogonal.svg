<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Two orthogonal directions in a plane versus five almost-orthogonal directions in the same plane" font-family="system-ui, sans-serif">
  <g fill="currentColor" font-size="14">
    <text x="55" y="28">2 dimensions, 2 features</text>
    <text x="352" y="28">2 dimensions, 5 features</text>
  </g>

  <g stroke="currentColor" fill="none" stroke-opacity="0.3" stroke-width="1.3">
    <circle cx="160" cy="165" r="92"/>
    <circle cx="460" cy="165" r="92"/>
  </g>

  <!-- orthogonal pair -->
  <g stroke="currentColor" fill="none" stroke-width="2.4">
    <path d="M160 165 L250 165"/>
    <path d="M160 165 L160 75"/>
    <path d="M160 145 H180 V165" stroke-width="1.4" stroke-opacity="0.6"/>
  </g>

  <!-- five directions, 72 degrees apart -->
  <g stroke="currentColor" fill="none" stroke-width="2.4">
    <path d="M460 165 L460 75"/>
    <path d="M460 165 L374 137"/>
    <path d="M460 165 L407 238"/>
    <path d="M460 165 L513 238"/>
    <path d="M460 165 L546 137"/>
  </g>

  <g fill="currentColor" font-size="13" fill-opacity="0.85">
    <text x="60" y="290">exactly perpendicular: no interference,</text>
    <text x="60" y="308">and the plane is full at two</text>
    <text x="352" y="290">72° apart: each pair leaks cos 72° ≈ 0.31</text>
    <text x="352" y="308">into the other, and a ReLU clips it away</text>
  </g>
  <g fill="currentColor" font-size="13">
    <text x="60" y="255">the plane holds no third</text>
    <text x="352" y="255">room for three more</text>
  </g>
</svg>
