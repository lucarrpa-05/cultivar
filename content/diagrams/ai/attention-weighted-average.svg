<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" role="img" aria-label="Five word vectors combined into one by weights that add up to one" font-family="system-ui, sans-serif">
  <g fill="currentColor" font-size="14">
    <text x="30" y="28">The word &#8220;it&#8221; asks every earlier word: how much of you do I need?</text>
  </g>

  <!-- the five tokens, each drawn as a little stack of numbers (a vector) -->
  <g stroke="currentColor" fill="none">
    <g stroke-width="1.5" stroke-opacity="0.55">
      <rect x="40" y="48" width="74" height="46" rx="5"/>
      <rect x="160" y="48" width="74" height="46" rx="5"/>
      <rect x="280" y="48" width="74" height="46" rx="5"/>
      <rect x="400" y="48" width="74" height="46" rx="5"/>
      <rect x="520" y="48" width="74" height="46" rx="5"/>
    </g>
  </g>
  <g fill="currentColor" font-size="14" text-anchor="middle">
    <text x="77" y="68">The</text>
    <text x="197" y="68">cat</text>
    <text x="317" y="68">sat</text>
    <text x="437" y="68">on</text>
    <text x="557" y="68">it</text>
  </g>
  <g fill="currentColor" font-size="11" fill-opacity="0.6" text-anchor="middle">
    <text x="77" y="86">vector</text>
    <text x="197" y="86">vector</text>
    <text x="317" y="86">vector</text>
    <text x="437" y="86">vector</text>
    <text x="557" y="86">vector</text>
  </g>

  <!-- the weights, as bars: width of the bar is the weight -->
  <g stroke="currentColor" stroke-width="10" stroke-linecap="butt" stroke-opacity="0.75">
    <path d="M77 112 h4"/>
    <path d="M197 112 h85"/>
    <path d="M317 112 h10"/>
    <path d="M437 112 h6"/>
    <path d="M557 112 h16"/>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="middle">
    <text x="77" y="140">0.03</text>
    <text x="197" y="140">0.71</text>
    <text x="317" y="140">0.08</text>
    <text x="437" y="140">0.05</text>
    <text x="557" y="140">0.13</text>
  </g>
  <g fill="currentColor" font-size="12" fill-opacity="0.65">
    <text x="30" y="163">the five weights add up to exactly 1 &#8212; that is what softmax is for</text>
  </g>

  <!-- arrows down into the sum; thickness follows the weight -->
  <g stroke="currentColor" fill="none" stroke-linecap="round">
    <path d="M77 172 C 77 210, 300 200, 322 224" stroke-width="1" stroke-opacity="0.4"/>
    <path d="M197 172 C 197 212, 300 200, 325 224" stroke-width="7" stroke-opacity="0.85"/>
    <path d="M317 172 C 317 200, 320 205, 330 224" stroke-width="1.6" stroke-opacity="0.45"/>
    <path d="M437 172 C 437 210, 360 200, 336 224" stroke-width="1.2" stroke-opacity="0.4"/>
    <path d="M557 172 C 557 212, 380 200, 340 224" stroke-width="2.4" stroke-opacity="0.6"/>
  </g>

  <!-- the output -->
  <g stroke="currentColor" fill="none" stroke-width="2">
    <rect x="176" y="226" width="310" height="44" rx="6"/>
  </g>
  <g fill="currentColor" font-size="14" text-anchor="middle">
    <text x="331" y="254">a new vector for &#8220;it&#8221;, mostly made of &#8220;cat&#8221;</text>
  </g>
  <g fill="currentColor" font-size="13" fill-opacity="0.75" text-anchor="middle">
    <text x="331" y="296">0.03&#183;The + 0.71&#183;cat + 0.08&#183;sat + 0.05&#183;on + 0.13&#183;it</text>
  </g>
  <g fill="currentColor" font-size="12" fill-opacity="0.6" text-anchor="middle">
    <text x="331" y="316">an average, with weights the model chose</text>
  </g>
</svg>
