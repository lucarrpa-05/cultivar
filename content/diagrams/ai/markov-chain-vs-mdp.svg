<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" role="img" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="currentColor" font-size="13">
    <text x="18" y="20">Markov chain</text>
    <text x="238" y="20">Markov decision process</text>
  </g>

  <!-- chain -->
  <g stroke="currentColor" fill="none" stroke-width="1.6" marker-end="url(#ar)">
    <path d="M52 78 H108"/>
    <path d="M132 100 L96 140"/>
    <path d="M62 128 L62 96"/>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="currentColor" fill-opacity="0.08">
    <circle cx="38" cy="78" r="17"/>
    <circle cx="124" cy="86" r="17"/>
    <circle cx="80" cy="152" r="17"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="38" y="82">sun</text>
    <text x="124" y="90">rain</text>
    <text x="80" y="156">fog</text>
    <text x="80" y="66" font-size="11" fill-opacity="0.8">0.3</text>
  </g>
  <text x="18" y="196" fill="currentColor" font-size="11" fill-opacity="0.8">arrows are fixed; you can only forecast</text>

  <!-- mdp -->
  <g stroke="currentColor" stroke-width="1.6" fill="currentColor" fill-opacity="0.08">
    <circle cx="258" cy="78" r="17"/>
    <circle cx="390" cy="60" r="17"/>
    <circle cx="372" cy="160" r="17"/>
  </g>
  <g stroke="currentColor" fill="currentColor" stroke-width="1.4">
    <circle cx="312" cy="56" r="5"/>
    <circle cx="308" cy="118" r="5"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.4">
    <path d="M272 70 L306 58"/>
    <path d="M268 92 L303 114"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="5 3">
    <path d="M318 54 L371 59"/>
    <path d="M316 60 L360 145"/>
    <path d="M313 120 L356 152"/>
    <path d="M311 112 L374 71"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="258" y="82">here</text>
    <text x="390" y="64">good</text>
    <text x="372" y="164">bad</text>
    <text x="304" y="42" font-size="11" fill-opacity="0.85">wait</text>
    <text x="292" y="136" font-size="11" fill-opacity="0.85">go</text>
  </g>
  <text x="238" y="196" fill="currentColor" font-size="11" fill-opacity="0.8">each choice brings its own arrows; now you steer</text>
</svg>
