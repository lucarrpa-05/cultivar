<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="The double descent curve: test error falls, peaks at the interpolation threshold, then falls again" font-family="system-ui, sans-serif">
  <!-- axes -->
  <g stroke="currentColor" fill="none" stroke-width="1.6" stroke-opacity="0.7">
    <path d="M70 300 H610"/>
    <path d="M70 40 V300"/>
  </g>

  <!-- interpolation threshold -->
  <g stroke="currentColor" fill="none" stroke-width="1.4" stroke-opacity="0.55" stroke-dasharray="5 5">
    <path d="M335 45 V300"/>
  </g>

  <!-- training error: falls to zero at the threshold and stays there -->
  <path d="M90 150 C150 215 240 275 335 297 L610 297" fill="none" stroke="currentColor" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="7 4"/>

  <!-- test error: the double descent -->
  <path d="M90 108 C130 172 165 200 200 203 C250 208 300 150 335 78 C360 132 395 205 440 222 C500 240 560 240 610 238"
        fill="none" stroke="currentColor" stroke-width="2.6"/>

  <!-- marks -->
  <g fill="currentColor" fill-opacity="0.9">
    <circle cx="200" cy="203" r="4"/>
    <circle cx="335" cy="78" r="4"/>
    <circle cx="610" cy="238" r="4"/>
  </g>

  <g fill="currentColor" font-size="13">
    <text x="128" y="196">classical minimum</text>
    <text x="262" y="66">the peak</text>
    <text x="452" y="212">second descent, below the old minimum</text>
    <text x="96" y="280" fill-opacity="0.7">training error</text>
    <text x="96" y="96">test error</text>
  </g>

  <g fill="currentColor" font-size="13" fill-opacity="0.8">
    <text x="345" y="326">interpolation threshold: capacity ≈ number of training points</text>
    <text x="70" y="326">← classical regime</text>
  </g>
  <g fill="currentColor" font-size="13">
    <text x="70" y="30">error</text>
    <text x="470" y="348">model capacity, training time, or 1 / data</text>
  </g>
</svg>
