<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" role="img" aria-label="A vertical stream of vectors that every layer reads from and adds back into" font-family="system-ui, sans-serif">
  <g fill="currentColor" font-size="14">
    <text x="24" y="26">One vector per token travels straight down. Nothing replaces it; things are added to it.</text>
  </g>

  <!-- the stream -->
  <g stroke="currentColor" fill="none">
    <path d="M330 46 V 394" stroke-width="9" stroke-opacity="0.25"/>
    <path d="M330 46 V 394" stroke-width="2"/>
    <path d="M323 386 L330 398 L337 386" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g fill="currentColor" font-size="12" fill-opacity="0.7" text-anchor="middle">
    <text x="330" y="418">the residual stream</text>
  </g>

  <!-- start -->
  <g stroke="currentColor" fill="none" stroke-width="1.6" stroke-opacity="0.7">
    <rect x="212" y="46" width="236" height="30" rx="6"/>
  </g>
  <g fill="currentColor" font-size="13" text-anchor="middle">
    <text x="330" y="66">the token&#8217;s embedding starts the stream</text>
  </g>

  <!-- branch helper: a box that reads left and writes back with a plus -->
  <!-- layer 1 attention (left) -->
  <g stroke="currentColor" fill="none" stroke-width="1.6">
    <path d="M330 104 H 190" stroke-opacity="0.6"/>
    <rect x="44" y="90" width="146" height="34" rx="6"/>
    <path d="M118 124 V 150 H 320" stroke-opacity="0.6"/>
    <circle cx="330" cy="150" r="10"/>
  </g>
  <g fill="currentColor" font-size="13" text-anchor="middle">
    <text x="117" y="112">attention</text>
    <text x="330" y="155" font-size="14">+</text>
  </g>
  <g fill="currentColor" font-size="11" fill-opacity="0.65" text-anchor="middle">
    <text x="117" y="140">moves information between tokens</text>
  </g>

  <!-- layer 1 MLP (right) -->
  <g stroke="currentColor" fill="none" stroke-width="1.6">
    <path d="M330 184 H 470" stroke-opacity="0.6"/>
    <rect x="470" y="170" width="146" height="34" rx="6"/>
    <path d="M543 204 V 230 H 340" stroke-opacity="0.6"/>
    <circle cx="330" cy="230" r="10"/>
  </g>
  <g fill="currentColor" font-size="13" text-anchor="middle">
    <text x="543" y="192">MLP</text>
    <text x="330" y="235" font-size="14">+</text>
  </g>
  <g fill="currentColor" font-size="11" fill-opacity="0.65" text-anchor="middle">
    <text x="543" y="220">thinks about one token at a time</text>
  </g>

  <!-- layer 2 attention (left) -->
  <g stroke="currentColor" fill="none" stroke-width="1.6">
    <path d="M330 264 H 190" stroke-opacity="0.6"/>
    <rect x="44" y="250" width="146" height="34" rx="6"/>
    <path d="M118 284 V 306 H 320" stroke-opacity="0.6"/>
    <circle cx="330" cy="306" r="10"/>
  </g>
  <g fill="currentColor" font-size="13" text-anchor="middle">
    <text x="117" y="272">attention</text>
    <text x="330" y="311" font-size="14">+</text>
  </g>

  <!-- layer 2 MLP (right) -->
  <g stroke="currentColor" fill="none" stroke-width="1.6">
    <path d="M330 334 H 470" stroke-opacity="0.6"/>
    <rect x="470" y="320" width="146" height="34" rx="6"/>
    <path d="M543 354 V 372 H 340" stroke-opacity="0.6"/>
    <circle cx="330" cy="372" r="10"/>
  </g>
  <g fill="currentColor" font-size="13" text-anchor="middle">
    <text x="543" y="342">MLP</text>
    <text x="330" y="377" font-size="14">+</text>
  </g>

  <g fill="currentColor" font-size="12" fill-opacity="0.65">
    <text x="24" y="316">&#8942; dozens more of these</text>
  </g>
  <g fill="currentColor" font-size="12" fill-opacity="0.75" text-anchor="end">
    <text x="640" y="398">at the bottom, read off the next-token probabilities</text>
  </g>
</svg>
