<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" role="img" aria-label="Four archery targets showing the four combinations of bias and variance" font-family="system-ui, sans-serif">
  <g fill="currentColor" font-size="14">
    <text x="20" y="26">Bias is where the shots land on average. Variance is how far they scatter.</text>
  </g>

  <g stroke="currentColor" fill="none">
    <!-- target 1: low bias, low variance -->
    <g stroke-opacity="0.45" stroke-width="1.3">
      <circle cx="170" cy="135" r="56"/><circle cx="170" cy="135" r="38"/><circle cx="170" cy="135" r="20"/>
    </g>
    <circle cx="170" cy="135" r="3" stroke-opacity="0.8" stroke-width="1.5"/>
    <!-- target 2: low bias, high variance -->
    <g stroke-opacity="0.45" stroke-width="1.3">
      <circle cx="440" cy="135" r="56"/><circle cx="440" cy="135" r="38"/><circle cx="440" cy="135" r="20"/>
    </g>
    <circle cx="440" cy="135" r="3" stroke-opacity="0.8" stroke-width="1.5"/>
    <!-- target 3: high bias, low variance -->
    <g stroke-opacity="0.45" stroke-width="1.3">
      <circle cx="170" cy="300" r="56"/><circle cx="170" cy="300" r="38"/><circle cx="170" cy="300" r="20"/>
    </g>
    <circle cx="170" cy="300" r="3" stroke-opacity="0.8" stroke-width="1.5"/>
    <!-- target 4: high bias, high variance -->
    <g stroke-opacity="0.45" stroke-width="1.3">
      <circle cx="440" cy="300" r="56"/><circle cx="440" cy="300" r="38"/><circle cx="440" cy="300" r="20"/>
    </g>
    <circle cx="440" cy="300" r="3" stroke-opacity="0.8" stroke-width="1.5"/>
  </g>

  <g fill="currentColor" fill-opacity="0.85">
    <!-- shots: tight on centre -->
    <circle cx="165" cy="131" r="4"/><circle cx="175" cy="138" r="4"/><circle cx="169" cy="142" r="4"/>
    <circle cx="177" cy="129" r="4"/><circle cx="162" cy="139" r="4"/>
    <!-- shots: scattered around centre -->
    <circle cx="409" cy="110" r="4"/><circle cx="470" cy="152" r="4"/><circle cx="433" cy="178" r="4"/>
    <circle cx="474" cy="104" r="4"/><circle cx="404" cy="160" r="4"/>
    <!-- shots: tight, off to the upper right -->
    <circle cx="203" cy="271" r="4"/><circle cx="212" cy="278" r="4"/><circle cx="205" cy="282" r="4"/>
    <circle cx="214" cy="269" r="4"/><circle cx="200" cy="279" r="4"/>
    <!-- shots: scattered and off-centre -->
    <circle cx="452" cy="253" r="4"/><circle cx="496" cy="286" r="4"/><circle cx="466" cy="305" r="4"/>
    <circle cx="489" cy="252" r="4"/><circle cx="447" cy="292" r="4"/>
  </g>

  <g fill="currentColor" font-size="13" text-anchor="middle">
    <text x="170" y="214">low bias, low variance</text>
    <text x="440" y="214">low bias, high variance</text>
    <text x="170" y="379">high bias, low variance</text>
    <text x="440" y="379">high bias, high variance</text>
  </g>
  <g fill="currentColor" font-size="12" fill-opacity="0.75" text-anchor="middle">
    <text x="170" y="232">good sight, steady hand</text>
    <text x="440" y="232">good sight, shaky hand</text>
    <text x="170" y="397">crooked sight, steady hand</text>
    <text x="440" y="397">crooked sight, shaky hand</text>
  </g>
</svg>
