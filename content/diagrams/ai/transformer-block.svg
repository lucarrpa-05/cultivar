<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-label="One transformer block: normalize, attention, add, normalize, MLP, add" font-family="system-ui, sans-serif">
  <g fill="currentColor" font-size="14">
    <text x="24" y="26">One block, twice over: normalise, compute, add back.</text>
  </g>

  <!-- main line in -->
  <g stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M30 150 H 92"/>
  </g>
  <g fill="currentColor" font-size="13">
    <text x="24" y="138">in</text>
  </g>

  <!-- first half: norm -> attention -> add -->
  <g stroke="currentColor" fill="none" stroke-width="1.6">
    <rect x="92" y="128" width="72" height="44" rx="6"/>
    <rect x="186" y="118" width="110" height="64" rx="6"/>
    <circle cx="330" cy="150" r="12"/>
    <path d="M164 150 H 186" stroke-width="2"/>
    <path d="M296 150 H 318" stroke-width="2"/>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="middle">
    <text x="128" y="147">layer</text>
    <text x="128" y="161">norm</text>
    <text x="241" y="146" font-size="13">multi-head</text>
    <text x="241" y="162" font-size="13">attention</text>
    <text x="330" y="156" font-size="15">+</text>
  </g>

  <!-- skip 1 -->
  <g stroke="currentColor" fill="none" stroke-width="1.6" stroke-dasharray="5 4" stroke-opacity="0.7">
    <path d="M78 150 V 88 H 330 V 138"/>
  </g>
  <g fill="currentColor" font-size="11" fill-opacity="0.7" text-anchor="middle">
    <text x="204" y="78">the input goes round untouched</text>
  </g>

  <!-- second half: norm -> MLP -> add -->
  <g stroke="currentColor" fill="none" stroke-width="1.6">
    <path d="M342 150 H 372" stroke-width="2"/>
    <rect x="372" y="128" width="72" height="44" rx="6"/>
    <rect x="466" y="118" width="110" height="64" rx="6"/>
    <circle cx="610" cy="150" r="12"/>
    <path d="M444 150 H 466" stroke-width="2"/>
    <path d="M576 150 H 598" stroke-width="2"/>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="middle">
    <text x="408" y="147">layer</text>
    <text x="408" y="161">norm</text>
    <text x="521" y="146" font-size="13">MLP</text>
    <text x="521" y="162" font-size="13">(wide, then back)</text>
    <text x="610" y="156" font-size="15">+</text>
  </g>

  <!-- skip 2 -->
  <g stroke="currentColor" fill="none" stroke-width="1.6" stroke-dasharray="5 4" stroke-opacity="0.7">
    <path d="M358 150 V 88 H 610 V 138"/>
  </g>

  <!-- out -->
  <g stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M610 162 V 200"/>
    <path d="M603 192 L610 204 L617 192"/>
  </g>
  <g fill="currentColor" font-size="13" text-anchor="middle">
    <text x="610" y="222">out</text>
  </g>

  <!-- parameter accounting -->
  <g stroke="currentColor" fill="none" stroke-width="1.4" stroke-opacity="0.5">
    <path d="M186 192 V 246 H 296"/>
    <path d="M466 192 V 246 H 576"/>
  </g>
  <g fill="currentColor" font-size="13">
    <text x="186" y="272">four square matrices</text>
    <text x="186" y="290">query, key, value, output</text>
    <text x="186" y="312" font-size="14">about 4d&#178; weights</text>
    <text x="440" y="272">two rectangles</text>
    <text x="440" y="290">out to 4d and back</text>
    <text x="440" y="312" font-size="14">about 8d&#178; weights</text>
  </g>
  <g fill="currentColor" font-size="13" fill-opacity="0.75">
    <text x="24" y="344">So two thirds of the parameters in a block are in the part that never looks at another token.</text>
  </g>
</svg>
