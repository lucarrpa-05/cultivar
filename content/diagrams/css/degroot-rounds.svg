  <g fill="currentColor" font-size="14"><text x="95" y="93" text-anchor="middle">90</text><text x="95" y="161" text-anchor="middle">20</text><text x="95" y="229" text-anchor="middle">50</text><text x="230" y="93" text-anchor="middle">55</text><text x="230" y="161" text-anchor="middle">53</text><text x="230" y="229" text-anchor="middle">35</text><text x="365" y="93" text-anchor="middle">54</text><text x="365" y="161" text-anchor="middle">48</text><text x="365" y="229" text-anchor="middle">44</text><text x="500" y="93" text-anchor="middle">51</text><text x="500" y="161" text-anchor="middle">49</text><text x="500" y="229" text-anchor="middle">46</text></g>
