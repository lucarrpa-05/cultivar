  <g fill="currentColor" font-size="13">
    <text x="16" y="24">Nobody argues. Everyone averages the people they listen to.</text>
    <text x="16" y="277" fill-opacity="0.75">Beto listens to all three and is heard by all three, so he ends up worth 3/7 of the answer.</text>
