<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A Mercator graticule with four circles of equal true size drawn at the equator, thirty, sixty and seventy-five degrees, each larger than the last">
  <g fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1">
    <line x1="40" y1="270" x2="380" y2="270"/>
    <line x1="40" y1="213" x2="380" y2="213"/>
    <line x1="40" y1="134" x2="380" y2="134"/>
    <line x1="40" y1="60" x2="380" y2="60"/>
    <line x1="40" y1="46" x2="40" y2="282"/>
    <line x1="380" y1="46" x2="380" y2="282"/>
  </g>
  <g fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5">
    <circle cx="150" cy="270" r="8"/>
    <circle cx="150" cy="213" r="9.2"/>
    <circle cx="150" cy="134" r="16"/>
    <circle cx="150" cy="60" r="30.9"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="currentColor">
    <text x="4" y="274">0°</text>
    <text x="0" y="217">30°</text>
    <text x="0" y="138">60°</text>
    <text x="0" y="64">75°</text>
    <text x="200" y="274">area ×1</text>
    <text x="200" y="217">area ×1.3</text>
    <text x="200" y="138">area ×4</text>
    <text x="215" y="64">area ×15</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="currentColor" fill-opacity="0.75">
    <text x="40" y="26">Every circle covers the same ground in reality.</text>
    <text x="40" y="40">On Mercator, area is multiplied by sec² of the latitude.</text>
    <text x="40" y="296">Greenland sits between 60° and 83° N. Africa straddles the equator.</text>
  </g>
</svg>
