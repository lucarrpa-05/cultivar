<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="The rational number line split into a lower and an upper set with no rational at the boundary" font-family="system-ui, sans-serif">
<g fill="currentColor" font-size="14"><text x="50" y="34">Split the rationals by the rule: does the square come out below 2, or above?</text></g>
<g fill="none" stroke="currentColor"><path d="M50 130 H590" stroke-width="1.6" stroke-opacity="0.45"/></g>
<g fill="currentColor">
<circle cx="162.5" cy="130" r="4"/>
<circle cx="275.0" cy="130" r="4"/>
<circle cx="320.0" cy="130" r="4"/>
<circle cx="365.0" cy="130" r="4"/>
<circle cx="367.3" cy="130" r="4"/>
<circle cx="368.1" cy="130" r="4"/>
<circle cx="368.2" cy="130" r="4"/>
</g>
<g fill="none" stroke="currentColor" stroke-width="1.6">
<circle cx="387.5" cy="130" r="4"/>
<circle cx="369.5" cy="130" r="4"/>
<circle cx="368.4" cy="130" r="4"/>
<circle cx="368.2" cy="130" r="4"/>
<circle cx="410.0" cy="130" r="4"/>
<circle cx="500.0" cy="130" r="4"/>
<circle cx="567.5" cy="130" r="4"/>
</g>
<g fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"><path d="M368.2 68 V 196"/></g>
<g fill="currentColor" font-size="13">
<text x="360.2" y="62" text-anchor="end">A: squares below 2</text>
<text x="376.2" y="62">B: squares above 2</text>
<text x="368.2" y="216" text-anchor="middle" font-size="13">A has no largest member. B has no smallest.</text>
<text x="368.2" y="238" text-anchor="middle" font-size="13" fill-opacity="0.8">Nothing rational sits at the line. Dedekind declares the cut itself to be the number.</text>
</g>
<g fill="currentColor" font-size="12" fill-opacity="0.7"><text x="50" y="156">filled = in A</text><text x="500" y="156">hollow = in B</text></g>
</svg>