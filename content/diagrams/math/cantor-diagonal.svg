<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Cantor's diagonal argument on a list of decimal expansions" font-family="system-ui, sans-serif">
  <g fill="currentColor" font-size="14">
    <text x="30" y="30">Someone claims this list contains every real number between 0 and 1.</text>
  </g>

  <!-- row labels -->
  <g fill="currentColor" font-size="14" fill-opacity="0.65">
    <text x="30" y="76">1st</text>
    <text x="30" y="110">2nd</text>
    <text x="30" y="144">3rd</text>
    <text x="30" y="178">4th</text>
    <text x="30" y="212">5th</text>
    <text x="30" y="243">⋮</text>
  </g>

  <!-- the listed numbers, monospaced by hand: digits every 34 units from x=110 -->
  <g fill="currentColor" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="72" y="76">0.</text>
    <text x="110" y="76">3</text><text x="144" y="76">1</text><text x="178" y="76">4</text><text x="212" y="76">1</text><text x="246" y="76">5</text><text x="280" y="76">…</text>

    <text x="72" y="110">0.</text>
    <text x="110" y="110">2</text><text x="144" y="110">7</text><text x="178" y="110">1</text><text x="212" y="110">8</text><text x="246" y="110">2</text><text x="280" y="110">…</text>

    <text x="72" y="144">0.</text>
    <text x="110" y="144">1</text><text x="144" y="144">6</text><text x="178" y="144">1</text><text x="212" y="144">8</text><text x="246" y="144">0</text><text x="280" y="144">…</text>

    <text x="72" y="178">0.</text>
    <text x="110" y="178">5</text><text x="144" y="178">0</text><text x="178" y="178">0</text><text x="212" y="178">0</text><text x="246" y="178">0</text><text x="280" y="178">…</text>

    <text x="72" y="212">0.</text>
    <text x="110" y="212">4</text><text x="144" y="212">1</text><text x="178" y="212">4</text><text x="212" y="212">2</text><text x="246" y="212">1</text><text x="280" y="212">…</text>
  </g>

  <!-- diagonal highlight -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.85">
    <rect x="100" y="60" width="26" height="22" rx="4"/>
    <rect x="134" y="94" width="26" height="22" rx="4"/>
    <rect x="168" y="128" width="26" height="22" rx="4"/>
    <rect x="202" y="162" width="26" height="22" rx="4"/>
    <rect x="236" y="196" width="26" height="22" rx="4"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="4 4">
    <path d="M113 82 L147 116 L181 150 L215 184 L249 218 L272 241"/>
  </g>

  <!-- the new number -->
  <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.5">
    <path d="M30 262 H600"/>
  </g>
  <g fill="currentColor" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="72" y="292">0.</text>
    <text x="110" y="292">5</text><text x="144" y="292">5</text><text x="178" y="292">5</text><text x="212" y="292">5</text><text x="246" y="292">4</text><text x="280" y="292">…</text>
  </g>
  <g fill="currentColor" font-size="14">
    <text x="330" y="292">differs from row n at place n</text>
    <text x="330" y="76">read down</text>
    <text x="330" y="94">the diagonal,</text>
    <text x="330" y="112">change every digit</text>
    <text x="30" y="322" font-size="13" fill-opacity="0.75">Only the digits 4 and 5 are used, so no 0.4999… = 0.5 collision can sneak in.</text>
  </g>
</svg>
