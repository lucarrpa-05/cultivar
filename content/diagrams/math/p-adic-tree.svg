<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="A tree of 3-adic balls: numbers agreeing on more trailing base-3 digits sit on the same branch" font-family="system-ui, sans-serif">
<g fill="none" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.55">
<path d="M320 82 L120 140"/>
<path d="M320 82 L320 140"/>
<path d="M320 82 L520 140"/>
<path d="M120 164 L60 226"/>
<path d="M120 164 L120 226"/>
<path d="M120 164 L180 226"/>
<path d="M320 164 L260 226"/>
<path d="M320 164 L320 226"/>
<path d="M320 164 L380 226"/>
<path d="M520 164 L460 226"/>
<path d="M520 164 L520 226"/>
<path d="M520 164 L580 226"/>
</g>
<g fill="currentColor" font-size="13" text-anchor="middle">
<text x="320" y="72">every integer</text>
<text x="120" y="154">ends in 0</text>
<text x="320" y="154">ends in 1</text>
<text x="520" y="154">ends in 2</text>
<text x="60" y="240" font-size="12" fill-opacity="0.8">00</text>
<text x="120" y="240" font-size="12" fill-opacity="0.8">10</text>
<text x="180" y="240" font-size="12" fill-opacity="0.8">20</text>
<text x="260" y="240" font-size="12" fill-opacity="0.8">01</text>
<text x="320" y="240" font-size="12" fill-opacity="0.8">11</text>
<text x="380" y="240" font-size="12" fill-opacity="0.8">21</text>
<text x="460" y="240" font-size="12" fill-opacity="0.8">02</text>
<text x="520" y="240" font-size="12" fill-opacity="0.8">12</text>
<text x="580" y="240" font-size="12" fill-opacity="0.8">22</text>
</g>
<g fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4">
<path d="M24 180 H616"/>
</g>
<g fill="currentColor" font-size="13">
<text x="24" y="30">Write integers in base 3. Two of them are 3-adically close when they agree on more trailing digits.</text>
<text x="24" y="284" font-size="12" fill-opacity="0.8">Distance is fixed by the depth where two paths separate, so it only ever takes the values 1, 1/3, 1/9, 1/27, …</text>
<text x="24" y="306" font-size="12" fill-opacity="0.8">Among any three points, two of the three separation depths are equal: every triangle in this metric is isosceles.</text>
</g></svg>