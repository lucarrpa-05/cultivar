<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="A disk whose boundary circle is dashed, containing a straight line through the centre and two curved lines through a point above it that never meet the first line inside the disk" font-family="system-ui, sans-serif">
  <g fill="currentColor" font-size="14">
    <text x="30" y="34">Everything lives inside the disk. The dashed edge is infinitely far away.</text>
  </g>

  <g fill="none" stroke="currentColor">
    <circle cx="200" cy="200" r="130" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.6"/>
    <path d="M70 200 H330" stroke-width="2.6"/>
    <path d="M108 108 Q200 172 292 108" stroke-width="2"/>
    <path d="M78 156 Q232 160 259 84" stroke-width="2"/>
  </g>

  <g fill="currentColor">
    <circle cx="200" cy="140" r="5"/>
  </g>

  <g fill="currentColor" font-size="13">
    <text x="206" y="134">a point</text>
    <text x="338" y="208">a straight line</text>
  </g>

  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.6">
    <path d="M334 204 H366"/>
  </g>

  <g fill="currentColor" font-size="14">
    <text x="380" y="118">Through that one point run</text>
    <text x="380" y="140">infinitely many lines that never</text>
    <text x="380" y="162">meet the first one.</text>
    <text x="380" y="210" fill-opacity="0.75">Euclid's fifth postulate allows</text>
    <text x="380" y="232" fill-opacity="0.75">exactly one. Here it fails,</text>
    <text x="380" y="254" fill-opacity="0.75">and nothing breaks.</text>
  </g>
  <g fill="currentColor" font-size="13" fill-opacity="0.75">
    <text x="30" y="360">Lines are arcs that hit the dashed edge at right angles. Distance stretches as you approach it, so the arcs really are straight.</text>
  </g>
</svg>
