<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="A triangle showing the pair of vector spaces mapping by the canonical bilinear map into their tensor product, any bilinear map out of the pair, and the unique linear map from the tensor product that fills the triangle" font-family="system-ui, sans-serif">
  <g fill="currentColor" font-size="14">
    <text x="40" y="34">Every bilinear map out of a pair factors through one space, in exactly one way.</text>
  </g>

  <g fill="currentColor" font-size="16" text-anchor="middle">
    <text x="130" y="105">V x W</text>
    <text x="500" y="105">V tensor W</text>
    <text x="315" y="252">U</text>
  </g>

  <g stroke="currentColor" fill="none" stroke-width="1.8">
    <path d="M185 98 H452" marker-end="url(#tip)"/>
    <path d="M150 122 L295 232" marker-end="url(#tip)"/>
    <path d="M492 122 L345 232" stroke-dasharray="7 6" marker-end="url(#tip)"/>
  </g>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <g fill="currentColor" font-size="13">
    <text x="272" y="88" text-anchor="middle">bilinear, the universal one</text>
    <text x="150" y="190">any bilinear map</text>
    <text x="400" y="190" fill-opacity="0.8">exactly one linear map</text>
  </g>
  <g fill="currentColor" font-size="13" fill-opacity="0.75">
    <text x="40" y="288">The dashed arrow is what the tensor product is for: it turns "bilinear" into "linear".</text>
  </g>
</svg>
