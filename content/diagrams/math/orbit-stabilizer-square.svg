<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="A square whose four corners form one orbit under its eight symmetries, with a two-element stabiliser shown as a diagonal mirror" font-family="system-ui, sans-serif">
  <g fill="currentColor" font-size="14">
    <text x="40" y="36">Eight moves act on four corners. Follow one corner.</text>
  </g>

  <g stroke="currentColor" fill="none">
    <rect x="110" y="70" width="180" height="180" stroke-width="2.5"/>
    <path d="M110 250 L290 70" stroke-width="2" stroke-dasharray="7 6"/>
  </g>

  <g fill="currentColor">
    <circle cx="110" cy="70" r="10"/>
    <circle cx="290" cy="70" r="7" fill-opacity="0.45"/>
    <circle cx="290" cy="250" r="7" fill-opacity="0.45"/>
    <circle cx="110" cy="250" r="7" fill-opacity="0.45"/>
  </g>

  <g stroke="currentColor" fill="none" stroke-width="1.6" stroke-opacity="0.7">
    <path d="M126 58 Q200 30 276 58"/>
    <path d="M302 86 Q330 160 302 236"/>
    <path d="M276 262 Q200 290 126 262"/>
  </g>

  <g fill="currentColor" font-size="14">
    <text x="352" y="104">The corner can go to all four places.</text>
    <text x="352" y="126" fill-opacity="0.75">That is its orbit: 4.</text>
    <text x="352" y="176">Two moves leave it exactly where it is:</text>
    <text x="352" y="198" fill-opacity="0.75">doing nothing, and the dashed mirror.</text>
    <text x="352" y="220" fill-opacity="0.75">That is its stabiliser: 2.</text>
  </g>
  <g fill="currentColor" font-size="15">
    <text x="352" y="270">4 x 2 = 8, the whole group.</text>
  </g>
</svg>
