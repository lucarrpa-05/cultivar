<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" role="img" aria-label="The lattice of subfields between the rationals and the field generated by root two and root three, beside the lattice of subgroups of the Klein four-group, drawn upside down so corresponding levels line up" font-family="system-ui, sans-serif">
  <g fill="currentColor" font-size="14" font-weight="600">
    <text x="30" y="30">fields between Q and Q(root2, root3)</text>
    <text x="410" y="30">subgroups of the Galois group</text>
  </g>

  <g stroke="currentColor" fill="none" stroke-width="1.6" stroke-opacity="0.8">
    <path d="M150 72 L60 132"/><path d="M150 72 L150 132"/><path d="M150 72 L240 132"/>
    <path d="M60 168 L150 232"/><path d="M150 168 L150 232"/><path d="M240 168 L150 232"/>
    <path d="M530 72 L440 132"/><path d="M530 72 L530 132"/><path d="M530 72 L620 132"/>
    <path d="M440 168 L530 232"/><path d="M530 168 L530 232"/><path d="M620 168 L530 232"/>
  </g>

  <g fill="currentColor" font-size="14" text-anchor="middle">
    <text x="150" y="66">Q(root2, root3)</text>
    <text x="60" y="152">Q(root2)</text>
    <text x="150" y="152">Q(root6)</text>
    <text x="240" y="152">Q(root3)</text>
    <text x="150" y="250">Q</text>

    <text x="530" y="66">the trivial group</text>
    <text x="440" y="152">order 2</text>
    <text x="530" y="152">order 2</text>
    <text x="620" y="152">order 2</text>
    <text x="530" y="250">the whole group, order 4</text>
  </g>

  <g stroke="currentColor" fill="none" stroke-width="1.3" stroke-dasharray="5 5" stroke-opacity="0.55">
    <path d="M250 62 H418"/>
    <path d="M300 148 H386"/>
    <path d="M190 246 H404"/>
  </g>

  <g fill="currentColor" font-size="13" fill-opacity="0.75">
    <text x="30" y="300">Bigger field, smaller group. The dashed lines are the correspondence: each subfield is exactly what some subgroup fixes.</text>
  </g>
</svg>
