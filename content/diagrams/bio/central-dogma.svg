<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="The central dogma: DNA to RNA to protein, with reverse transcription dashed and transfers out of protein crossed out" font-family="system-ui, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <g stroke="currentColor" fill="none">
    <!-- DNA: two strands -->
    <g stroke-width="2.4">
      <path d="M60 140 q16 -18 32 0 q16 18 32 0 q16 -18 32 0"/>
      <path d="M60 164 q16 18 32 0 q16 -18 32 0 q16 18 32 0"/>
    </g>
    <g stroke-width="1.2" stroke-opacity="0.55">
      <path d="M76 148 V156"/><path d="M108 156 V148"/><path d="M140 148 V156"/>
    </g>

    <!-- replication loop over DNA -->
    <path d="M70 128 q60 -52 120 0" stroke-width="2" marker-end="url(#head)"/>

    <!-- DNA -> RNA -->
    <path d="M186 152 H272" stroke-width="2.4" marker-end="url(#head)"/>

    <!-- RNA: single wavy strand -->
    <path d="M292 152 q16 -18 32 0 q16 18 32 0 q16 -18 32 0" stroke-width="2.4"/>

    <!-- RNA -> protein -->
    <path d="M418 152 H500" stroke-width="2.4" marker-end="url(#head)"/>

    <!-- reverse transcription, dashed, RNA back to DNA -->
    <path d="M296 176 q-50 42 -110 0" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#head)"/>

    <!-- protein: bead chain -->
    <path d="M516 152 H636" stroke-width="2"/>
  </g>

  <g fill="currentColor" fill-opacity="0.85">
    <circle cx="520" cy="152" r="7"/><circle cx="549" cy="140" r="7"/><circle cx="578" cy="160" r="7"/>
    <circle cx="607" cy="142" r="7"/><circle cx="634" cy="156" r="7"/>
  </g>

  <!-- the forbidden transfers out of protein -->
  <g stroke="currentColor" fill="none" stroke-width="2">
    <path d="M584 196 q-90 56 -300 8" stroke-opacity="0.5"/>
    <g stroke-width="2.6">
      <path d="M424 232 L448 256"/><path d="M448 232 L424 256"/>
    </g>
  </g>

  <g fill="currentColor" font-size="15">
    <text x="122" y="200" text-anchor="middle">DNA</text>
    <text x="356" y="200" text-anchor="middle">RNA</text>
    <text x="578" y="200" text-anchor="middle">protein</text>
  </g>
  <g fill="currentColor" font-size="13" fill-opacity="0.8">
    <text x="130" y="62" text-anchor="middle">replication</text>
    <text x="229" y="140" text-anchor="middle">transcription</text>
    <text x="459" y="140" text-anchor="middle">translation</text>
    <text x="228" y="222" text-anchor="middle">reverse transcription</text>
    <text x="436" y="284" text-anchor="middle">no way back out of protein</text>
  </g>
</svg>
