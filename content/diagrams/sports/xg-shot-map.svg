<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Penalty area seen from above with three shot positions and the angle of goal each one sees">
  <g fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="12" y1="50" x2="388" y2="50"/>
    <rect x="53" y="50" width="294" height="120"/>
    <rect x="133" y="50" width="134" height="40"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="3.5">
    <line x1="173" y1="50" x2="227" y2="50"/>
  </g>
  <g fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5" stroke-width="1">
    <polygon points="200,95 173,50 227,50"/>
    <polygon points="155,52 173,50 227,50"/>
    <polygon points="200,268 173,50 227,50"/>
  </g>
  <g fill="currentColor">
    <circle cx="200" cy="95" r="13" fill-opacity="0.85"/>
    <circle cx="155" cy="52" r="5" fill-opacity="0.85"/>
    <circle cx="200" cy="268" r="4" fill-opacity="0.85"/>
    <circle cx="200" cy="130" r="2.5" fill-opacity="0.7"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="currentColor">
    <text x="218" y="99">central, six metres: most of the goal is visible</text>
    <text x="70" y="40" text-anchor="start">same distance from goal, almost no goal visible</text>
    <text x="212" y="272">thirty metres: far and narrow</text>
    <text x="207" y="134" font-size="11" fill-opacity="0.75">penalty spot, a flat 0.79</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="currentColor" fill-opacity="0.7">
    <text x="12" y="186">marker size is what history says the shot is worth</text>
  </g>
</svg>
