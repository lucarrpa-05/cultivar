    <path d="M330 196 V126" stroke-width="2.5" stroke-dasharray="4 3"/>
    <path d="M324 196 H336" stroke-width="2"/>
    <path d="M324 126 H336" stroke-width="2"/>
  </g>
  <g fill="currentColor" fill-opacity="0.55">
    <circle cx="160" cy="243" r="3.5"/><circle cx="185" cy="222" r="3.5"/><circle cx="205" cy="236" r="3.5"/>
    <circle cx="232" cy="214" r="3.5"/><circle cx="256" cy="222" r="3.5"/><circle cx="278" cy="199" r="3.5"/>
    <circle cx="300" cy="208" r="3.5"/><circle cx="318" cy="190" r="3.5"/>
    <circle cx="344" cy="132" r="3.5"/><circle cx="364" cy="116" r="3.5"/><circle cx="386" cy="128" r="3.5"/>
    <circle cx="410" cy="106" r="3.5"/><circle cx="436" cy="114" r="3.5"/><circle cx="462" cy="96" r="3.5"/>
    <circle cx="488" cy="104" r="3.5"/><circle cx="506" cy="86" r="3.5"/>
  </g>
  <g fill="currentColor" font-size="14">
    <text x="352" y="166">el salto es el efecto</text>
    <text x="118" y="70">nadie controla su puntaje</text>
    <text x="118" y="88">al punto exacto</text>
  </g>
  <g fill="currentColor" font-size="13" fill-opacity="0.78">
