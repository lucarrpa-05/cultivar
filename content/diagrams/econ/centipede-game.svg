<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="A centipede game tree: four decision nodes in a row, each with a take branch going down to payoffs and a pass branch going right, ending in the largest payoff" font-family="system-ui, sans-serif">
  <g stroke="currentColor" fill="none" stroke-width="2">
    <path d="M80 110 H480"/>
    <path d="M80 110 V160"/>
    <path d="M180 110 V160"/>
    <path d="M280 110 V160"/>
    <path d="M380 110 V160"/>
  </g>
  <g fill="currentColor">
    <circle cx="80" cy="110" r="5"/>
    <circle cx="180" cy="110" r="5"/>
    <circle cx="280" cy="110" r="5"/>
    <circle cx="380" cy="110" r="5"/>
    <circle cx="480" cy="110" r="5" fill-opacity="0.4"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="80" y="96" text-anchor="middle">player 1</text>
    <text x="180" y="96" text-anchor="middle">player 2</text>
    <text x="280" y="96" text-anchor="middle">player 1</text>
    <text x="380" y="96" text-anchor="middle">player 2</text>
    <text x="80" y="178" text-anchor="middle">0.40 / 0.10</text>
    <text x="180" y="178" text-anchor="middle">0.20 / 0.80</text>
    <text x="280" y="178" text-anchor="middle">1.60 / 0.40</text>
    <text x="380" y="178" text-anchor="middle">0.80 / 3.20</text>
    <text x="480" y="96" text-anchor="middle">6.40 / 1.60</text>
  </g>
  <g fill="currentColor" font-size="12" fill-opacity="0.75">
    <text x="130" y="104" text-anchor="middle">pass</text>
    <text x="92" y="140">take</text>
    <text x="80" y="32">Taking ends it. Passing doubles the pot and hands over the decision.</text>
    <text x="80" y="52">Backward induction says player 1 takes 0.40 on the very first move.</text>
    <text x="80" y="232">Out of 662 games McKelvey and Palfrey ran, that happened 37 times.</text>
  </g>
</svg>
