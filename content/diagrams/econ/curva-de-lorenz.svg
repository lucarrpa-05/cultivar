<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-label="Curva de Lorenz y el área que define el Gini" font-family="system-ui, sans-serif">
  <g stroke="currentColor" fill="none">
    <path d="M70 320 H460" stroke-width="2"/>
    <path d="M70 320 V40" stroke-width="2"/>
    <!-- línea de igualdad perfecta -->
    <path d="M70 320 L450 50" stroke-width="2" stroke-dasharray="6 5"/>
    <!-- curva de Lorenz -->
    <path d="M70 320 C 200 314, 320 270, 450 50" stroke-width="3"/>
  </g>
  <!-- área A entre las dos -->
  <path d="M70 320 L450 50 C 320 270, 200 314, 70 320 Z" fill="currentColor" fill-opacity="0.16"/>
  <g fill="currentColor" font-size="15">
    <text x="236" y="150">A</text>
    <text x="330" y="270">B</text>
    <text x="150" y="86">igualdad perfecta</text>
  </g>
  <g fill="currentColor" font-size="13" fill-opacity="0.8">
    <text x="196" y="300">curva de Lorenz</text>
    <text x="70" y="348">hogares, del más pobre al más rico</text>
    <text x="14" y="64">ingreso</text>
    <text x="14" y="82">acumulado</text>
  </g>
  <g fill="currentColor" font-size="14">
    <text x="70" y="372">Gini = A / (A + B)</text>
  </g>
</svg>
