<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" role="img" aria-label="A four-round table of applicant-proposing deferred acceptance across three hospitals, showing two applicants being displaced before everyone settles on their second choice" font-family="system-ui, sans-serif">
  <g stroke="currentColor" fill="none" stroke-width="1.2" stroke-opacity="0.45">
    <path d="M60 84 H470"/>
    <path d="M60 130 H470"/>
    <path d="M60 176 H470"/>
    <path d="M60 222 H470"/>
    <path d="M60 268 H470"/>
    <path d="M60 84 V268 M196 58 V268 M331 58 V268 M470 58 V268"/>
  </g>
  <g fill="currentColor" font-size="13">
    <text x="130" y="76" text-anchor="middle">H1</text>
    <text x="265" y="76" text-anchor="middle">H2</text>
    <text x="400" y="76" text-anchor="middle">H3</text>
  </g>
  <g fill="currentColor" font-size="11">
    <text x="64" y="112" font-size="12" fill-opacity="0.8">round 1</text>
    <text x="130" y="104" text-anchor="middle">A2, A3 propose</text>
    <text x="130" y="119" text-anchor="middle" fill-opacity="0.75">holds A3, rejects A2</text>
    <text x="265" y="104" text-anchor="middle">A1 proposes</text>
    <text x="265" y="119" text-anchor="middle" fill-opacity="0.75">holds A1</text>
    <text x="64" y="158" font-size="12" fill-opacity="0.8">round 2</text>
    <text x="130" y="150" text-anchor="middle">holds A3</text>
    <text x="265" y="150" text-anchor="middle">A2 proposes</text>
    <text x="265" y="165" text-anchor="middle" fill-opacity="0.75">holds A2, rejects A1</text>
    <text x="64" y="204" font-size="12" fill-opacity="0.8">round 3</text>
    <text x="130" y="196" text-anchor="middle">A1 proposes</text>
    <text x="130" y="211" text-anchor="middle" fill-opacity="0.75">holds A1, rejects A3</text>
    <text x="265" y="196" text-anchor="middle">holds A2</text>
    <text x="64" y="250" font-size="12" fill-opacity="0.8">round 4</text>
    <text x="130" y="242" text-anchor="middle">holds A1</text>
    <text x="265" y="242" text-anchor="middle">holds A2</text>
    <text x="400" y="242" text-anchor="middle">A3 proposes</text>
    <text x="400" y="257" text-anchor="middle" fill-opacity="0.75">accepted</text>
  </g>
  <g fill="currentColor" font-size="13">
    <text x="60" y="36">Applicants propose, hospitals hold. Nothing is accepted until the proposals stop.</text>
  </g>
  <g fill="currentColor" font-size="12" fill-opacity="0.75">
    <text x="60" y="296">A1 and A3 are each dropped by a hospital that had already said yes. Everyone lands on their second choice.</text>
  </g>
</svg>
